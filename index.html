<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Unit 5G: City & Directions Master</title>
    <style>
        :root { --primary: #4f46e5; --bg: #f1f5f9; }
        body { font-family: sans-serif; background: var(--bg); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .game-container { max-width: 800px; width: 100%; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .view { display: none; } .view.active { display: block; }
        .map-img { width: 100%; height: auto; border: 4px solid #334155; border-radius: 12px; }
        .route-box { background: #0f172a; color: white; padding: 20px; border-radius: 12px; margin-top: 20px; }
        .map-ans-btn { display: block; width: 100%; padding: 15px; margin-top: 10px; background: #334155; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>City Navigation</h1>
    <div id="map" class="view active">
        <!-- Ссылка на конкретную карту из вашего пина -->
        <img src="https://i.pinimg.com/736x/8f/c9/78/8fc97858c42b10091395f1906a206716.jpg" alt="City Map" class="map-img">
        
        <div class="route-box">
            <div id="route-text">Loading...</div>
            <div id="map-opts"></div>
            <div id="feedback" style="margin-top:10px; font-weight:bold;"></div>
        </div>
    </div>
</div>

<script>
    const mapRoutes = [
        {
            instruction: "Start at the bottom near the red arrow. Go straight up Magnolia Street, past the traffic lights, to the crossroads. Turn left on Maple Avenue. Where are you?",
            correct: "Pizza Restaurant",
            options: ["Pizza Restaurant", "Bank", "School", "Police Station"]
        },
        {
            instruction: "Start at the red arrow. Go straight up Magnolia Street, turn right on Harmony Park Avenue. What building is on the corner?",
            correct: "Bank",
            options: ["Bank", "Pet Shop", "Police Station", "Hospital"]
        }
    ];

    let currentRouteIndex = 0;

    function startMapGame() {
        const route = mapRoutes[currentRouteIndex];
        document.getElementById('route-text').innerHTML = "<b>Route:</b> " + route.instruction;
        const optsContainer = document.getElementById('map-opts');
        optsContainer.innerHTML = '';
        route.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'map-ans-btn';
            btn.innerText = opt;
            btn.onclick = () => {
                if(opt === route.correct) {
                    document.getElementById('feedback').innerText = "Correct! 🎉";
                    currentRouteIndex = (currentRouteIndex + 1) % mapRoutes.length;
                    setTimeout(startMapGame, 1500);
                } else {
                    document.getElementById('feedback').innerText = "Wrong, try again!";
                }
            };
            optsContainer.appendChild(btn);
        });
    }
    startMapGame();
</script>
</body>
</html>
