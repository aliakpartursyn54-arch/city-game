<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Unit 5G: City & Directions Master</title>
    <style>
        :root { --primary: #4f46e5; --bg: #f1f5f9; }
        body { font-family: sans-serif; background: var(--bg); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .game-container { max-width: 800px; width: 100%; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; background: #e2e8f0; }
        .tab-btn.active { background: var(--primary); color: white; }
        .view { display: none; } .view.active { display: block; }
        .f-card { height: 200px; background: #f8fafc; border: 2px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; margin-bottom: 10px; border-radius: 12px; }
        .map-img { width: 100%; height: auto; border: 4px solid #334155; border-radius: 12px; }
        .route-box { background: #0f172a; color: white; padding: 20px; border-radius: 12px; margin-top: 20px; }
        .map-ans-btn { display: block; width: 100%; padding: 15px; margin-top: 10px; background: #334155; border: 2px solid #4f46e5; color: white; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>City Navigation</h1>
    <div class="tabs">
        <button class="tab-btn active" onclick="showView('flashcards')">1. Flashcards</button>
        <button class="tab-btn" onclick="showView('quiz')">2. Words Quiz</button>
        <button class="tab-btn" onclick="showView('map')">3. Map Game</button>
    </div>

    <div id="flashcards" class="view active">
        <div id="fc-text" class="f-card">Go straight</div>
        <button onclick="nextFC()" class="map-ans-btn">Next Card</button>
    </div>

    <div id="quiz" class="view">
        <div id="quiz-text" style="font-size: 20px; margin-bottom: 10px;">What means "Turn left"?</div>
        <div id="quiz-opts"></div>
    </div>

    <div id="map" class="view">
        <img src="https://i.pinimg.com/736x/8f/c9/78/8fc97858c42b10091395f1906a206716.jpg" alt="City Map" class="map-img">
        <div class="route-box">
            <div id="route-text"></div>
            <div id="map-opts"></div>
            <div id="feedback" style="margin-top:10px; font-weight:bold;"></div>
        </div>
    </div>
</div>

<script>
    const flashcards = ["Go straight", "Turn left", "Turn right", "Cross the street", "Traffic lights", "Crossroads"];
    let fcIdx = 0;
    function nextFC() { fcIdx = (fcIdx + 1) % flashcards.length; document.getElementById('fc-text').innerText = flashcards[fcIdx]; }

    const mapRoutes = [
        { instruction: "Start at the red arrow. Go straight up Magnolia Street, past the traffic lights to the crossroads. Turn left on Maple Avenue. Where are you?", correct: "Pizza Restaurant", options: ["Pizza Restaurant", "Bank", "School", "Police Station"] }
    ];

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.target.classList.add('active');
    }

    function startMapGame() {
        const route = mapRoutes[0];
        document.getElementById('route-text').innerHTML = "<b>Route:</b> " + route.instruction;
        const opts = document.getElementById('map-opts');
        opts.innerHTML = '';
        route.options.forEach(o => {
            const b = document.createElement('button');
            b.className = 'map-ans-btn';
            b.innerText = o;
            b.onclick = () => document.getElementById('feedback').innerText = (o === route.correct ? "Correct! 🎉" : "Wrong!");
            opts.appendChild(b);
        });
    }
    startMapGame();
</script>
</body>
</html>
